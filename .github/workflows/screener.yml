name: Daily Stock Screener

on:
  schedule:
    # 13:00 UTC = 9:00am ET during EDT (summer), 8:00am ET during EST (winter).
    # Runs on weekdays only. Adjust the hour if you want it closer to market open.
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          SMTP_SERVER: stmp.gmail.com
          SMTP_PORT: 587
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMS_TO: ${{ secrets.SMS_TO }}
        run: python screener.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Output/screener_results.xlsx
          git diff --staged --quiet || git commit -m "Auto-update screener results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
